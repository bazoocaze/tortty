name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # winit (x11/wayland) e wgpu precisam dos headers de sistema para linkar
      - name: deps de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # o mesmo script do pre-commit: hook e CI não podem discordar
      - name: fmt + clippy + test
        run: ./tools/check.sh
      # o instalador é o que o usuário roda: um passo em prefixo temporário pega
      # caminho quebrado, `install` faltando e `--version` que não responde
      - name: instalador
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/inst" --no-shortcut \
            --binary target/release/bzmux
          "$RUNNER_TEMP/inst/bin/bzmux" --version
          ./install.sh --prefix "$RUNNER_TEMP/inst" --check
          ./install.sh --prefix "$RUNNER_TEMP/inst" --uninstall
          test ! -e "$RUNNER_TEMP/inst/bin/bzmux"
