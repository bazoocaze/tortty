name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # winit (x11/wayland) and wgpu need the system headers to link
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # the same script as the pre-commit: hook and CI cannot disagree
      - name: fmt + clippy + test
        run: ./tools/check.sh
      # the installer is what the user runs: a step on a temporary prefix catches a
      # broken path, a missing `install` and a `--version` that does not answer
      - name: selftest (no display)
        run: ./target/release/bzmux --selftest
      - name: installer
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/inst" --no-shortcut \
            --binary target/release/bzmux
          "$RUNNER_TEMP/inst/bin/bzmux" --version
          ./install.sh --prefix "$RUNNER_TEMP/inst" --check
          ./install.sh --prefix "$RUNNER_TEMP/inst" --uninstall
          test ! -e "$RUNNER_TEMP/inst/bin/bzmux"
