name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# two pushes in a row used to leave two five-minute runs fighting over the same
# cache; the newest commit is the one that matters
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # One job, weighed against four on 2026-11-20. The four-job run spent 410 s of
  # runner time and 540 s of *billed* time (9 minutes): GitHub rounds every job up
  # to the whole minute and charges a one-minute floor, so `seam` cost a minute for
  # 26 s of work, and setup, checkout, toolchain and apt were paid four times — the
  # same 2.1 MB of system deps downloaded three times (151 s) while the Azure mirror
  # served them at 33 kB/s. The split bought wall clock (3m04 against ~4m30) and
  # nothing else, and wall clock is not what is being paid for.
  #
  # What it costs: a red `fmt` now waits behind the release build. `quality-check.sh`
  # still prints one line per step with its own time, so a slow or broken step is
  # still named, and `--only` stays available for a local run of a single step.
  quality-check:
    name: quality-check
    runs-on: ubuntu-latest
    env:
      # One list for two steps: the mirror step resolves the biggest .deb of it to
      # probe the *pool* (an index probe calls a pool-slow mirror healthy, which is
      # how 2.1 MB took 1m47s at 20 kB/s while the index ran at 11 MB/s), and the
      # install step installs exactly it.
      APT_PACKAGES: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev
        libxi-dev libxcursor-dev libxinerama-dev
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      # winit (x11/wayland) and wgpu need the system headers; clippy compiles the
      # build scripts even though it never links. No font package: the glyph tests
      # load their own fonts from `crates/app/test-assets/` (52 KB, four subsets),
      # because what they assert is the fallback chain, not the machine. The real
      # ones cost `fonts-noto-cjk` = 61.2 MB, and the mirror served it at 59 kB/s —
      # 18 minutes of one job, on a run whose other three took 28-77 s.
      #
      # The mirror is the same one: the runner ships with azure.archive.ubuntu.com,
      # which collapses often enough that the two attempts of run 44664863154 paid
      # 55 s and 114 s for these 2.1 MB — 30 kB/s, 1/4 of the job, for seven headers
      # that never change. `.github/apt-mirror.sh` probes Ubuntu's own mirror list plus
      # the mirror the runner has, and points apt at the fastest, so the cost is a
      # few seconds instead of whatever the mirror feels like today. It lives here
      # because it is CI-only, and it is ours because the step needs sudo and
      # rewrites apt's sources: the trust surface should be a file in this repo,
      # reviewed in the diff, not a third-party action we would have to re-audit on
      # every bump. Verbose under Actions, so a slow run says which URL answered what.
      - name: .github/apt-mirror.sh
        run: ./.github/apt-mirror.sh
      - name: apt-get install (build deps)
        run: |
          # the mirror step refreshed the lists; the retry answers a runner image
          # whose lists are older than these packages, which apt reports as 404
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES \
            || { sudo apt-get update &&
                 sudo apt-get install -y --no-install-recommends $APT_PACKAGES; }
      # rust-toolchain.toml decides the compiler, here and on a laptop: a green
      # hook over a red CI (or the other way round) is a ruler that measures
      # itself. rustup installs what the file asks for on first use.
      - name: rustup install (rust-toolchain.toml)
        run: |
          rustup install --no-self-update
          rustup show active-toolchain
          rustc -V
      # one key, because there is one workspace and one `target/`: the seam's cross
      # builds land here too, and the measured 1m30 of them is compiling the app's
      # dependency tree twice (winit, wgpu, windows-sys), so `target/` is the cache
      # that matters — caching `~/.rustup` instead saved 17 s and cost 1m48 to save.
      - name: cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          key: all
      - name: tools/quality-check.sh
        run: ./tools/quality-check.sh
      # the installer is what the user runs: a step on a temporary prefix catches a
      # broken path, a missing `install` and a `--version` that does not answer
      - name: install.sh (install, --check, --uninstall)
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/inst" --no-shortcut \
            --binary target/release/tortty
          "$RUNNER_TEMP/inst/bin/tortty" --version
          ./install.sh --prefix "$RUNNER_TEMP/inst" --check
          ./install.sh --prefix "$RUNNER_TEMP/inst" --uninstall
          test ! -e "$RUNNER_TEMP/inst/bin/tortty"
      # The `platform` seam is one module (AGENTS.md), and what proves it holds is
      # that the other targets still build. `tortty-core` knows no window, pty, GPU
      # or clock, so a system call reaching the core breaks on every target. The app
      # is checked where it has an implementation (Windows, `M-X`); for macOS, which
      # has none (`M-Y`), the proof is `tools/platform-gate.sh`, which reads the
      # `compile_error!` guard instead of compiling `winit`+`wgpu` for a target that
      # cannot ship — measured 2026-11-22, that check was ~20 s of a ~46 s step.
      # Last because it is the slowest step and the least likely to fail.
      - name: cargo check (the other targets)
        run: |
          rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin
          # `cargo check` does not link and no crate in either graph asks for a C
          # compiler, so mingw-w64 stays out of this job; the link is measured on
          # the VM (docs/WIN10_VM.md, local only). The app check covers `tortty-core`
          # for Windows, so the core is only checked where the app is not.
          cargo check -p tortty --target x86_64-pc-windows-gnu
          echo "x86_64-pc-windows-gnu: builds, core and app"
          cargo check -p tortty-core --target x86_64-apple-darwin
          echo "x86_64-apple-darwin: core builds"
