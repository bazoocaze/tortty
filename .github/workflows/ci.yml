name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # winit (x11/wayland) and wgpu need the system headers to link, and the glyph
      # tests are assertions about a real font chain: a runner with no monospace
      # font and no CJK face fails them for being empty, not for being wrong
      - name: system deps and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev \
            fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
      # rust-toolchain.toml decides the compiler, here and on a laptop: a green
      # hook over a red CI (or the other way round) is a ruler that measures
      # itself. rustup installs what the file asks for on first use.
      - name: toolchain
        run: |
          rustup show active-toolchain
          rustc -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      # the same script as the pre-commit: hook and CI cannot disagree
      - name: fmt + clippy + test
        run: ./tools/quality-check.sh
      # the installer is what the user runs: a step on a temporary prefix catches a
      # broken path, a missing `install` and a `--version` that does not answer
      - name: selftest (no display)
        run: ./target/release/tortty --selftest
      - name: installer
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/inst" --no-shortcut \
            --binary target/release/tortty
          "$RUNNER_TEMP/inst/bin/tortty" --version
          ./install.sh --prefix "$RUNNER_TEMP/inst" --check
          ./install.sh --prefix "$RUNNER_TEMP/inst" --uninstall
          test ! -e "$RUNNER_TEMP/inst/bin/tortty"

  seam:
    # The `platform` seam is one module (AGENTS.md), and the proof that it holds is
    # these two targets. `tortty-core` must build for them — it knows no window,
    # pty, GPU or clock, so a system call reaching the core breaks here. The app
    # must stop on the seam's own `compile_error!` and on nothing else: before the
    # seam it was 35 errors on Windows and 4 on macOS, and a green build would mean
    # somebody went around it. When `M-X`/`M-Y` land, the second step becomes a
    # build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: toolchain and the other targets
        run: |
          rustup show active-toolchain
          rustc -V
          rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin
      - name: the core builds for the other systems
        run: |
          cargo check -p tortty-core --target x86_64-pc-windows-gnu
          cargo check -p tortty-core --target x86_64-apple-darwin
      - name: the app stops at the seam, and only there
        run: |
          for target in x86_64-pc-windows-gnu x86_64-apple-darwin; do
            if out=$(cargo check -p tortty --target "$target" 2>&1); then
              echo "::error::$target built: the seam is gone (M-X/M-Y closed?)"
              exit 1
            fi
            if ! printf '%s' "$out" | grep -q 'has no .platform. implementation'; then
              echo "::error::$target failed for a reason other than the seam:"
              printf '%s\n' "$out"
              exit 1
            fi
            echo "$target: stopped at the seam, as designed"
          done
