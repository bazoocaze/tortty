name: release

# Per `v*` tag: packages and publishes the binary that `install.sh --from-release`
# knows how to download (`tortty-<version>-<triple>.tar.gz`). The packaging is
# `tools/build-release.sh` — the same one that runs on the developer's machine, so what
# comes out of here is not a separate path.
#
# Coverage today: Linux x86_64 and aarch64. macOS (M7) and Windows (M6) do not yet
# compile end to end (ConPTY/signing); when they do, they come in as two more matrix
# rows and the rest stays the same.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static
          fi

      # rustup itself, not a third-party action: one less tag to pin
      - name: toolchain and the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          key: ${{ matrix.target }}

      - name: package
        env:
          # the cross linker that cargo does not guess
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: ./tools/build-release.sh --target "${{ matrix.target }}" --check-version "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*

  publish:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true
      # a single checksum file: it is what the user verifies after downloading
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz | tee SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
