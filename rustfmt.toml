# Formatting: `cargo fmt` (rustfmt). Stable options only — stable rustfmt
# ignores unstable ones with a warning, and a config that does nothing is worse
# than none.
edition = "2021"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_small_heuristics = "Default"
match_block_trailing_comma = true
