# Formatação: `cargo fmt` (rustfmt). Só opções estáveis — o rustfmt do stable
# ignora as instáveis com aviso, e config que não vale nada é pior que nenhuma.
edition = "2021"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_small_heuristics = "Default"
match_block_trailing_comma = true
