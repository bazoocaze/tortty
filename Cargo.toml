[workspace]
resolver = "2"
members = ["crates/bzmux-core", "crates/bzmux"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# O parse é o caminho quente do benchmark: sem otimização o número não vale.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
