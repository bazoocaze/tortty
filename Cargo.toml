[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.0.124"
edition = "2021"
license = "MIT"

# Workspace lints: the crates opt in with `[lints] workspace = true`.
#
# Rule of thumb: a lint the code **wants** to violate lives here, with the reason.
# A terminal is cell arithmetic — truncating f32 to u16 and losing f32 precision
# is the design, not sloppiness. What is left of `pedantic` is signal: inline
# format args, `&str` instead of `String`, item after statement.
[workspace.lints.rust]
unsafe_code = "deny" # only allowed block: a local `#[allow]` in debugsock (SO_PEERCRED)
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cell/pixel arithmetic: casting is the domain, not an accident
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "warn"
# app-internal API, not a published library
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# a `new()` returning `Self` without validation does not need `#[must_use]`
return_self_not_must_use = "allow"

# Backtraces need the line table; the rest of DWARF (types, variables, inlining)
# is 73% of a debug binary and nothing in this project reads it. Every artifact
# that cargo keeps around is three times smaller without it.
[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

# Parsing is the benchmark's hot path: without optimisation the number is worthless.
[profile.bench]
opt-level = 3
lto = "thin"
