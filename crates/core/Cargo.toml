[package]
name = "tortty-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TorTTY emulation core: cell, palette, VT parser and grid (no GUI)"

[lints]
workspace = true

[dependencies]
unicode-width = "0.2"
# kitty graphics: payload base64 and `o=z` (zlib). Both pure Rust.
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[[bin]]
name = "parsebench"
path = "src/bin/parsebench.rs"
