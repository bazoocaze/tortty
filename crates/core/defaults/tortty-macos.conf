# tortty — the macOS template of the defaults. It is parsed after the common
# base (`tortty.conf`): what is here is what macOS does differently.
#
# `super` IS the Command key here (⌘), so these lines are the ⌘ gestures a mac
# user already has in the fingers.
#
# Not exercised: there is no macOS build yet (`M-Y`). The parsing and the
# coverage are tested; which chord the system eats is the platform's convention,
# not something we measured.

font_family Menlo

map super+c copy
map super+v paste
map super+t new_tab
map super+w close_tab
map super+n new_workspace
# ⌘Q closes the workspace. On the last one it does nothing: there is no `quit`
# action, the window is closed by its own button.
map super+q close_workspace

# ⌘1..0 walks the tabs, as in every mac application. The workspaces keep
# Ctrl+Shift+1..0 from the base — and Ctrl+Shift is the workspace family here,
# because Ctrl+N/T/W in a terminal belong to the child.
map super+1 select_tab 1
map super+2 select_tab 2
map super+3 select_tab 3
map super+4 select_tab 4
map super+5 select_tab 5
map super+6 select_tab 6
map super+7 select_tab 7
map super+8 select_tab 8
map super+9 select_tab 9
map super+0 select_tab 10
# Alt+digit is deliberately absent: an unbound Option+1 types `¡` into the child,
# which is the unix behaviour, and binding it would take that away.

# ⌘↑/⌘↓ already means "scroll" in a mac terminal and ⌃↑ is Mission Control, so
# the workspace walk takes Option as well.
map super+alt+up ws_prev
map super+alt+down ws_next
map super+alt+shift+up ws_move_up
map super+alt+shift+down ws_move_down
