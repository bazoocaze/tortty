# tortty — built-in defaults: the part that is the same on every system.
#
# The keys where Linux, macOS and Windows disagree live in the template beside
# this file (`tortty-linux.conf`, `tortty-macos.conf`, `tortty-windows.conf`):
# a chord the system eats, or a modifier that means something else there. A line
# is in this file only when the same chord is correct, primary and free of a
# system collision on all three; everything else is in the template, which only
# adds and never frees a line of this one.
#
# The order is: this file, your system's template, ~/.config/tortty/tortty.conf.

# tab program. Empty = $SHELL from the environment. --cmd beats this value.
shell

# grid font, in POINTS (the DPI converts to pixels). The family is a line of the
# OS template: a family name only resolves on the system that has it.
font_size 12

# typographic ligatures: off (none), standard (liga/calt: fi, ->, !=) or
# all (standard + discretionary). Only shows up in a font that has them; the
# script shaping (Arabic, Devanagari) always runs, whatever the value.
ligatures standard

# cursor: block, beam or underline; blink is on/off (CSI 6 q from an app wins)
cursor_shape block
cursor_blink off

# what comes back on the next run: none (one tab, a clean screen), layout
# (the workspaces and tabs of the last run) or content (the layout plus what the
# tabs had on screen and in the history — a photograph, not the process: the
# shell starts again). The window position and size are always remembered,
# whatever this says.
restore_state layout

# history lines kept above the screen
scrollback 10000

# margin around the grid, in px
window_padding_width 0

# BEL: none (ignores), visual (marks the window) or audible (beeps)
bell none

# mouse selection goes straight to CLIPBOARD (PRIMARY is always)
copy_on_select off

# bold text on the eight low colours draws the bright half (SGR 1 + colour 0-7)
bold_as_bright off

# where the state a program reports about itself stays visible (OSC 7501):
# chip (a chip on the last grid row), tab (the word on the tab label and the
# card) or none
status_show chip

# diagnostic log; `off` turns it off (--debug-log changes the path)
debug_log off

# shortcuts: `map CHORD ACTION [N]` and `unmap CHORD`. CHORD is modifiers joined
# with `+` (ctrl, alt, shift, super) plus one key: `ctrl+shift+t`, `alt+1`,
# `shift+pgup`, `f2`. `N`, for select_tab/select_workspace, is 1..10 (10 = key 0).
# `unmap` frees a chord so the program sees the key again. Actions:
# copy paste new_tab close_tab new_workspace close_workspace prev_prompt
# next_prompt open_config scroll_page_up scroll_page_down scroll_top scroll_bottom
# search select_tab select_workspace ws_prev ws_next ws_move_up ws_move_down.
# The lines below ARE the defaults: delete one and the key goes to the program,
# change the action and it changes for you. A digit under Ctrl/Alt/Super is read
# from the physical key, so Ctrl+Shift+2 still means 2 where it types `@`.
#
# These are the chords whose meaning is the same everywhere. Copy/paste, tab and
# workspace open/close, the digits under Alt/Super and the workspace walk are in
# the OS template, because there they are not the same chord.
map ctrl+shift+f search
map ctrl+shift+up prev_prompt
map ctrl+shift+down next_prompt
map ctrl+shift+f2 open_config
map shift+pgup scroll_page_up
map shift+pgdn scroll_page_down
map shift+home scroll_top
map shift+end scroll_bottom
# a workspace by number. Key 1 picks the first and key 0 the tenth.
map ctrl+shift+1 select_workspace 1
map ctrl+shift+2 select_workspace 2
map ctrl+shift+3 select_workspace 3
map ctrl+shift+4 select_workspace 4
map ctrl+shift+5 select_workspace 5
map ctrl+shift+6 select_workspace 6
map ctrl+shift+7 select_workspace 7
map ctrl+shift+8 select_workspace 8
map ctrl+shift+9 select_workspace 9
map ctrl+shift+0 select_workspace 10

# colours: foreground/background/cursor and the 16-colour ANSI palette.
# The defaults are the classic xterm palette: mc,
# htop and ls --color were calibrated on it, and swapping it for a "pretty
# theme" changes the meaning of the colours the program picked.
foreground #d6d6d6
background #000000
cursor_color #d6d6d6
color0 #000000
color1 #cd0000
color2 #00cd00
color3 #cdcd00
color4 #0000ee
color5 #cd00cd
color6 #00cdcd
color7 #e5e5e5
color8 #7f7f7f
color9 #ff0000
color10 #00ff00
color11 #ffff00
color12 #5c5cff
color13 #ff00ff
color14 #00ffff
color15 #ffffff
