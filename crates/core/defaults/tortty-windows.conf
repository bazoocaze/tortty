# tortty — the Windows template of the defaults. It is parsed after the common
# base (`tortty.conf`): what is here is what Windows does differently.
#
# Not exercised: there is no Windows build yet (`M-X`). The parsing and the
# coverage are tested; which chord the shell eats is the platform's convention,
# not something we measured.
#
# There is no `super` family at all: Win+1..0 launches the taskbar items,
# Win+↑/↓/←/→ snaps the window, and Win+N/Q/W/A/S/E/F/G/H/I/K/L/M/P/R/T/U/V/X/Z
# are the shell's. What is left under Win is not a shortcut a user should learn.

font_family Cascadia Mono

# Ctrl+Shift is the Windows Terminal convention, and it is also the safe one here
# (Ctrl+Alt would be AltGr on ABNT2/ABNT).
map ctrl+shift+c copy
map ctrl+shift+v paste
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+n new_workspace
map ctrl+shift+q close_workspace

# tabs on Alt+digit; the workspaces keep Ctrl+Shift+digit from the base.
# Key 1 picks the first and key 0 the tenth.
map alt+1 select_tab 1
map alt+2 select_tab 2
map alt+3 select_tab 3
map alt+4 select_tab 4
map alt+5 select_tab 5
map alt+6 select_tab 6
map alt+7 select_tab 7
map alt+8 select_tab 8
map alt+9 select_tab 9
map alt+0 select_tab 10

# the workspace walk, on the only family left that is free (Win+Ctrl+arrows, the
# system's own "switch virtual desktop", is the shell's)
map alt+up ws_prev
map alt+down ws_next
map alt+shift+up ws_move_up
map alt+shift+down ws_move_down
