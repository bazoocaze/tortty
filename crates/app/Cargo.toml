[package]
name = "tortty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TorTTY — fast, GPU based terminal"

[lints]
workspace = true

[dependencies]
tortty-core = { path = "../core" }
winit = "0.30"
# PNG of the kitty graphics protocol (f=100); pure Rust
png = "0.17"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
fontdb = "0.23"
swash = "0.2"
portable-pty = "0.9"
serde_json = "1"
# text only: `default-features = false` drops image support (tiff/png/jpeg)
arboard = { version = "3.7", default-features = false }
rustybuzz = "0.20.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "tortty"
path = "src/main.rs"
