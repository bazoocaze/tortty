[package]
name = "bzmux-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo de emulação do bzmux: célula, paleta, parser VT e grade (sem GUI)"

[lints]
workspace = true

[dependencies]
unicode-width = "0.2"
# gráficos do kitty: base64 do payload e `o=z` (zlib). Ambos puros em Rust.
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[[bin]]
name = "parsebench"
path = "src/bin/parsebench.rs"
